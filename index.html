    const simpleList = allCocktails.filter(c => c.ingCount <= 4);
    const complexList = allCocktails.filter(c => c.ingCount >= 5);
    let currentMode = 'simple';

    function render() {
        const container = document.getElementById('drinksContainer');
        const data = currentMode === 'simple' ? simpleList : complexList;
        const counterSpan = document.getElementById('cocktailCounter');
        const pageName = currentMode === 'simple' ? "Лаконичные коктейли (до 4 ингредиентов)" : "Многосоставные рецепты (5+ ингредиентов)";
        counterSpan.innerHTML = `${pageName} — всего рецептов: ${data.length}`;
        
        let html = '';
        data.forEach(c => {
            const ingHtml = c.ing.map(i=>`<span class="ingredient-badge">${escapeHtml(i)}</span>`).join('');
            const tracksHtml = c.tracks.map(tr=>`<li><i class="fas fa-music"></i> ${escapeHtml(tr)}</li>`).join('');
            const addHtml = c.addons.map(a=>`<span class="addon-item">${escapeHtml(a)}</span>`).join('');
            const accent = c.theme || '#d85f30';
            html += `<div class="drink-card" style="--accent: ${accent};">
                <div class="title-mural" style="border-bottom-color: ${accent};">
                    <h2 style="background: linear-gradient(135deg, #fff3e2, ${accent}); background-clip: text; -webkit-background-clip: text; color: transparent;">${escapeHtml(c.name)}</h2>
                    <div class="main-spirit" style="background: ${accent};">✦ ${escapeHtml(c.mainSpirit)}</div>
                </div>
                <div class="drink-content">
                    <div class="ingredients">${ingHtml}</div>
                    <div class="legend-block">📖 ${escapeHtml(c.story)}</div>
                    <div class="sensation"><i class="fas fa-fire"></i> Ощущения: ${escapeHtml(c.sensation)}</div>
                    <div class="mixology"><i class="fas fa-blender"></i> Микс: ${escapeHtml(c.mix)}</div>
                    <div class="food-pairing"><i class="fas fa-utensils"></i> Закуска: ${escapeHtml(c.pairing)}</div>
                    <div class="music-playlist" style="border-top-color: ${accent};"><div class="playlist-title"><i class="fas fa-headphones"></i> Плейлист</div><ul class="track-list">${tracksHtml}</ul></div>
                    <div class="addons-section" style="border-color: ${accent}70;"><div class="addons-title">✨ Чем дополнить</div><div class="addons-list">${addHtml}</div></div>
                    <button class="recipe-btn" data-ritual="${escapeHtml(c.ritual)}" data-name="${escapeHtml(c.name)}" data-accent="${accent}" style="background: linear-gradient(95deg, ${accent}bb, ${accent}55);"><i class="fas fa-mortar-pestle"></i> Полный ритуал</button>
                </div>
            </div>`;
        });
        container.innerHTML = html;
        attachModalEvents();
    }
    
    function attachModalEvents() {
        const modal = document.getElementById('modalRecipe');
        const close = document.getElementById('closeModal');
        const modalName = document.getElementById('modalName');
        const modalBody = document.getElementById('modalBody');
        const modalContent = document.getElementById('modalContent');
        document.querySelectorAll('.recipe-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                modalName.innerText = btn.getAttribute('data-name');
                modalBody.innerHTML = `<strong>РИТУАЛ ПРИГОТОВЛЕНИЯ:</strong><br>${btn.getAttribute('data-ritual')}`;
                modalContent.style.borderLeftColor = btn.getAttribute('data-accent') || '#e06836';
                modal.style.display = 'flex';
            });
        });
        close.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if(e.target === modal) modal.style.display = 'none'; };
    }
    
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentMode = btn.getAttribute('data-page');
            render();
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
    
    render();
    document.querySelector('.nav-btn[data-page="simple"]').classList.add('active');
</script>
